[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 2
enableCORS = true
enableStaticServing = false

[client]
showErrorDetails = "none"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#39D6C8"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#121A2B"
textColor = "#E6EDF7"
font = "sans serif"
